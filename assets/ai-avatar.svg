<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#152238" />
    </linearGradient>
    <linearGradient id="aiTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2b4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="aiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Dark Background Circle with Subtle Border -->
  <circle cx="50" cy="50" r="48" fill="url(#aiBg)" stroke="url(#aiTealGrad)" stroke-width="2.5" />

  <!-- Ambient Glow Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(0, 210, 180, 0.2)" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- AI Robot / Assistant Head Outline -->
  <rect x="25" y="32" width="50" height="42" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="url(#aiTealGrad)" stroke-width="2.5" filter="url(#glowFilter)" />

  <!-- Antenna -->
  <line x1="50" y1="32" x2="50" y2="20" stroke="url(#aiTealGrad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="50" cy="18" r="4.5" fill="#00d2b4" filter="url(#glowFilter)" />
  <circle cx="50" cy="18" r="2" fill="#ffffff" />

  <!-- Side Ear Nodes / Sensors -->
  <rect x="19" y="44" width="6" height="18" rx="3" fill="url(#aiTealGrad)" />
  <rect x="75" y="44" width="6" height="18" rx="3" fill="url(#aiTealGrad)" />

  <!-- Visor / Eye Display Area -->
  <rect x="31" y="40" width="38" height="16" rx="8" fill="#050a12" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />

  <!-- Glowing AI Eyes (Teal/Cyan Rounded Capsules) -->
  <ellipse cx="41" cy="48" rx="4.5" ry="4" fill="#00d2b4" filter="url(#glowFilter)" />
  <circle cx="42.5" cy="46.5" r="1.5" fill="#ffffff" />

  <ellipse cx="59" cy="48" rx="4.5" ry="4" fill="#00d2b4" filter="url(#glowFilter)" />
  <circle cx="60.5" cy="46.5" r="1.5" fill="#ffffff" />

  <!-- Smile / Speech Soundwave Indicator -->
  <path d="M40 64 Q50 70 60 64" fill="none" stroke="url(#aiTealGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Chest / Medical Plus Node subtle glow below head -->
  <path d="M50 78 v6 M47 81 h6" stroke="#00d2b4" stroke-width="1.5" stroke-linecap="round" />
</svg>
